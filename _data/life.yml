routes_note: >-
  I mostly go looking for climbs. Here are a few to try if you are riding around Irvine. PCH is
  still the prettiest though, on the days the drivers are nice.

routes:
  - name: Silverado
    kind: road
    detail: A gentle twenty minute climb, and a really nice one.
    figure: gentle

  - name: Buck Gully
    kind: gravel
    detail: My favourite gravel trail. People say it is an easy one tho. I have the QOM for now anyways lol
    figure: gravel

  - name: Newport Coast
    kind: road
    detail: A steady 6 percent.
    figure: "6%"

  - name: Top of the World
    kind: road
    detail: The Laguna classic. Best view of the coast around here. You can also get up there on gravel.
    figure: climb

  - name: Vista Ridge
    kind: road
    detail: Tack it on after Newport Coast. Short, a bit steep.
    figure: steep

  - name: Seven Sisters
    kind: road
    detail: Seven climbs back to back, almost no recovery in between.
    figure: hard but good

routes_outro: >-
  There are plenty of group rides around OC too.

