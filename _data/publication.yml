      - title: "Behind the Same Mask: Understanding the Practice of Spontaneous Collective Anonymity on Chinese Social Platforms"
        image: momo.png
        gif: momo.png
        authors:
          - Suqi Lou
          - Weijun Li
          - Chao Zhang
          - Shi Chen
          - Zhicong Lu
          - Yaxing Yao
        id: cscw25_momo
        doi: https://doi.org/10.1145/3710933
        venue: CSCW 2025
        venue_full: Proceedings of the ACM on Human-Computer Interaction
        abstract: On Chinese platforms where real-name policies make hiding hard, thousands of users have quietly adopted the same avatar and the same nickname, "momo". We interviewed 20 of them. Sharing one identity gave people a second layer of anonymity, room to speak in discussions they would otherwise skip, and, unexpectedly, a sense of belonging to a crowd they had never met.
