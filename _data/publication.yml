      - title: "Supporting The Many Lives of Personal Data with Rebite: LLM-Powered Goal-Directed Framing in Food Journaling"
        image: rebite.svg
        gif: rebite.gif
        authors:
          - Weijun Li
          - Daniel A. Epstein
        id: uist26_rebite
        doi: https://doi.org/10.1145/3830398.3830692
        video_file: rebite_teaser.mp4
        venue: UIST 2026
        venue_full: The 39th Annual ACM Symposium on User Interface Software and Technology
        abstract: People's health goals keep changing, but most tracking tools lock the meaning of data in at the moment it is logged, so a goal adopted later has nothing useful to work with. We propose goal-directed framing, which keeps meal records unstructured and lets a large language model interpret them through whatever goal is current. In a one-week deployment with 21 participants, reframing past meals under a new goal exposed overlaps and conflicts between goals and pushed people to renegotiate what they actually cared about.
        category:
          - health
          - ai
