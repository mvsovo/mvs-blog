      - title: "Family Context, Reproductive Experiences, and Digital Engagement in Relation to Women's Genetic Health Knowledge, Perceptions, and Communication"
        image: genetic_health.svg
        authors:
          - Ziqi Yang
          - Weijun Li
          - Di Hu
          - Daniel A. Epstein
          - Yunan Chen
        id: amia26_genetic_health
        venue: AMIA 2026
        venue_full: AMIA 2026 Annual Symposium
        abstract: A survey of 249 women in the United States on what makes genetic health feel personal. A bigger family network, having given birth, and broader technology use, including generative AI, each went with taking genes more seriously.
        category:
          - health
        featured: true

