        id: chi2021_capt_paper
        video: AeDKn5DwVfI
        venue: CHI 2021
        venue_full: 2021 CHI Conference on Human Factors in Computing Systems
        abstract: L2 English learners find it difficult to improve pronunciation due to lack of personalized feedback. This paper presents Pronunciation Teacher (PTeacher), a CAPT system offering personalized exaggerated audio-visual feedback. Interviewing 100 L2 learners and 22 native teachers, we propose three metrics to determine exaggeration levels in both modalities. We incorporate dynamic feedback based on learner proficiency. User studies indicate our system improves learning efficiency.
