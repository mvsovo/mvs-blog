  - year: '2024'
    pubs:
      - title: An Empathy-Based Sandbox Approach to Bridge Attitudes, Goals, Knowledge, and Behaviors in the Privacy Paradox
        image: sandbox.png
        gif: sandbox.gif
        authors:
          - Chaoran Chen
          - Weijun Li
          - Wenxin Song
          - Yanfang Ye
          - Yaxing Yao
          - Toby Jia-jun Li
        id: chi24_sandbox
        venue: CHI 2024
        venue_full: ''
        note:
        video: GDO5anAjTG8
        abstract: We introduce an empathy-based approach that allows users to experience how privacy behaviors may alter system outcomes in a risk-free sandbox environment from the perspective of artificially generated personas. To generate realistic personas, we introduce a novel pipeline that augments the outputs of large language models using few-shot learning, contextualization, and chain of thoughts.
        category:
          - ai
          - social
        featured: true

      - title: Practices and Challenges of Delivering Among Deaf or Hard of Hearing Couriers
        image: dhhd.png
        gif: dhhd.png
        authors:
          - Shi Chen
          - Xiaodong Wang
          - Weijun Li
          - Jiangao Zhang
          - Yuge Qi
          - Jiaqi Teng
          - Zhihan Zeng
        id: chi24_dhhd
        venue: CHI 2024
        venue_full: ''
        abstract: This paper explores the experiences of Deaf and Hard of Hearing (DHH) food delivery workers in China. We focus on their motivations, like better pay and community belonging, and their use of delivery platform tools, such as AI voice calls, for communication. Despite technological aids, human intervention remains important. We identify challenges such as safety risks, multitasking complexities, and mistrust in AI voice calls. Our findings offer insights for designing inclusive delivery platforms and broader implications for employment opportunities for DHH individuals, particularly in developing countries.
        category:
          - social
        featured: true

  - year: '2023'
    pubs:
      - title: What makes virtual intimacy...intimate? Understanding the Phenomenon and Practice of Computer-Mediated Paid Companionship
        image: intimacy.png
        gif: intimacy.gif
        authors:
          - Weijun Li
          - Shi Chen
          - Lingyun Sun
          - Changyuan Yang
        id: cscw2023_vlover_paper
        venue: CSCW 2023
        venue_full: ''
        abstract: In China, Virtual romance service (VRS) provides a direct dyadic intimacy, different from fan-idol parasocial ties. Our study of 178 surveys and 22 interviews revealed virtual lovers' strategies to meet customers' emotional needs. Customers value VRS for its emotional benefits without the need for long-term commitment. We conclude with insights into the unique nature of virtual lovers and design implications for digital companionship.
        category:
          - social
        featured: true

