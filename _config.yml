title: Weijun Li
tagline: Human-centered AI, health, and social computing at UC Irvine
url: "https://blog.mvsovo.fun"
baseurl: ""
lang: en

description: >-
  Weijun Li is a second-year Informatics Ph.D. student at UC Irvine, advised by
  Daniel Epstein in the PIE Lab. Her research sits at the intersection of
  human-centered AI, health, and social computing. She builds and studies
  interactive systems that help people make sense of information about
  themselves, their health, and their everyday lives. Work at CHI, CSCW, UIST,
  and AMIA.

