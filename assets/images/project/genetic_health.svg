<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 602" width="1000" height="602" role="img"
  aria-label="Among 249 women surveyed, a bigger family, having given birth, and using generative AI each went with taking genes more seriously">
  <defs>
    <filter id="gh-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B9AE9C" flood-opacity="0.28" />
    </filter>
    <style>
      .t { font-family: "Avenir Next Rounded", "Nunito", "Quicksand", "Avenir Next", "Segoe UI", system-ui, sans-serif; }
      .row { font-size: 24px; font-weight: 500; fill: #57524A; }
      .num { font-size: 96px; font-weight: 800; fill: #1F1D1B; }
      .micro { font-size: 15px; font-weight: 700; fill: #A39C92; letter-spacing: 1.8px; }
      .cap { font-size: 24px; font-weight: 500; fill: #A39C92; }
    </style>
  </defs>

  <g filter="url(#gh-shadow)">
    <rect fill="#FFFFFF" stroke="#E7E2D9" stroke-width="2" x="110" y="86" width="780" height="352" rx="26" />
  </g>

  <text class="t num" x="166" y="256">249</text>
  <text class="t micro" x="172" y="294">WOMEN SURVEYED</text>

  <rect x="450" y="128" width="392" height="60" rx="14" fill="#F4F1EA" />
  <circle cx="482" cy="158" r="9" fill="#7ABFFF" />
  <text class="t row" x="506" y="166">Bigger family</text>
  <path d="M804 172 v-30 M792 152 l12 -14 12 14" fill="none" stroke="#E8738F" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round" />

  <rect x="450" y="202" width="392" height="60" rx="14" fill="#F4F1EA" />
  <circle cx="482" cy="232" r="9" fill="#F5C84C" />
  <text class="t row" x="506" y="240">Has given birth</text>
  <path d="M804 246 v-30 M792 226 l12 -14 12 14" fill="none" stroke="#E8738F" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round" />

  <rect x="450" y="276" width="392" height="60" rx="14" fill="#F4F1EA" />
  <circle cx="482" cy="306" r="9" fill="#E8738F" />
  <text class="t row" x="506" y="314">Uses generative AI</text>
  <path d="M804 320 v-30 M792 300 l12 -14 12 14" fill="none" stroke="#E8738F" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round" />

  <path d="M450 378 H 842" fill="none" stroke="#EDE9E1" stroke-width="2" />
  <text class="t micro" x="450" y="410">TAKES GENES MORE SERIOUSLY</text>

  <text class="t cap" x="500" y="520" text-anchor="middle">what makes genes feel personal</text>
</svg>
